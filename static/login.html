<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SensorWatch | Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            padding: 40px;
            transition: transform 0.3s ease;
        }
        .container:hover {
            transform: translateY(-5px);
        }
        .logo {
            text-align: center;
            margin-bottom: 35px;
        }
        .logo h1 {
            color: #4A5568;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .logo p {
            color: #718096;
            font-size: 16px;
        }
        .form {
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .input-group {
            margin-bottom: 25px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #4A5568;
            font-weight: 600;
        }
        .input-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #E2E8F0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .input-group input:focus {
            border-color: #667EEA;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(102, 126, 234, 0.4);
        }
        .btn:active {
            transform: translateY(0);
        }
        .forgot-password {
            text-align: center;
            margin-top: 20px;
        }
        .forgot-password a {
            color: #667EEA;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        .forgot-password a:hover {
            text-decoration: underline;
            color: #5A67D8;
        }
        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            display: none;
            animation: fadeIn 0.4s ease;
        }
        .success {
            background-color: #F0FFF4;
            color: #2D7844;
            border: 1px solid #9AE6B4;
        }
        .error {
            background-color: #FED7D7;
            color: #C53030;
            border: 1px solid #FC8181;
        }
        .info {
            background-color: #BEE3F8;
            color: #2C5AA0;
            border: 1px solid #90CDF4;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #A0AEC0;
            font-size: 12px;
            border-top: 1px solid #E2E8F0;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🔒 SensorWatch Login</h1>
            <p>Secure access to your dashboard</p>
        </div>
        
        <div class="form-container">
            
            <!-- Login Form -->
            <form class="form" id="login-form">
                <div class="input-group">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" placeholder="Enter your username" required>
                </div>
                <div class="input-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn">Sign In</button>
                <div class="forgot-password">
                    <a href="#" id="forgot-password-link">Forgot your password?</a>
                </div>
            </form>
            
            <div class="message" id="message"></div>
        </div>
        
        <div class="footer">
            <p>&copy; 2025 SensorWatch | Secure Dashboard Access</p>
        </div>
    </div>
    
    <script>
        // Sample users database (in production, this should be server-side)
        const users = [
            { username: 'admin', password: 'admin123', name: 'Administrator' },
            { username: 'demo', password: 'demo123', name: 'Demo User' }
        ];
        
        // DOM Elements
        const loginForm = document.getElementById('login-form');
        const message = document.getElementById('message');
        const forgotPasswordLink = document.getElementById('forgot-password-link');
        
        // Check if user is already logged in
        if (sessionStorage.getItem('isLoggedIn') === 'true') {
            window.location.href = '/dashboard';
        }
        
        // Forgot password placeholder
        forgotPasswordLink.addEventListener('click', (e) => {
            e.preventDefault();
            showMessage('Please contact your administrator to reset your password.', 'info');
        });
        
        // Form submission handler
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            
            if (!username || !password) {
                showMessage('Please fill in all fields.', 'error');
                return;
            }
            
            // Check credentials
            const user = users.find(u => u.username === username && u.password === password);
            
            if (user) {
                showMessage('Login successful! Redirecting to dashboard...', 'success');
                
                // Store login state
                sessionStorage.setItem('isLoggedIn', 'true');
                sessionStorage.setItem('username', username);
                sessionStorage.setItem('name', user.name);
                
                // Redirect to dashboard after 1 second
                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 1000);
            } else {
                showMessage('Invalid username or password.', 'error');
            }
        });
        
        // Helper functions
        function showMessage(text, type) {
            message.textContent = text;
            message.className = 'message ' + type;
            message.style.display = 'block';
            
            // Auto-hide success messages after 5 seconds
            if (type === 'success' || type === 'info') {
                setTimeout(() => {
                    hideMessage();
                }, 5000);
            }
        }
        
        function hideMessage() {
            message.style.display = 'none';
        }
        
        // Initialize the page
        document.addEventListener('DOMContentLoaded', () => {
            console.log('SensorWatch Login System loaded successfully!');
            
            // Focus on the first input field of the active form
            const activeForm = document.querySelector('.form.active');
            if (activeForm) {
                const firstInput = activeForm.querySelector('input');
                if (firstInput) {
                    firstInput.focus();
                }
            }
        });
    </script>
</body>
</html>
