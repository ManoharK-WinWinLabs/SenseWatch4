<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SensorWatch Dashboard</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Chart.js for graphing -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            limegreen: '#98F190',
            darkaccent: '#1E1F25',
            lightgrey: '#40424f',
            pinkaccent: '#FB7A7C',
            lightred: '#610002',
            yellowbtn: '#EFFF7C',
            deepblack: '#09090B',
            greenbtntext: '#00361C'
          }
        }
      }
    }
  </script>

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  
  <style>
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.8);
    }
    
    .modal-content {
      background-color: #1E1F25;
      margin: 2% auto;
      padding: 30px;
      border-radius: 15px;
      width: 95%;
      max-width: 1400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      max-height: 90vh;
      overflow-y: auto;
    }
    
    .close {
      color: #98F190;
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      transition: color 0.3s;
    }
    
    .close:hover,
    .close:focus {
      color: #FB7A7C;
    }
    
    .stat-card {
      background: #40424f;
      padding: 12px 24px;
      border-radius: 9px;
      text-align: center;
      min-width: 110px;
      border-left: 3px solid #98F190;
    }
    
    .stat-label {
      font-size: 13px;
      color: #a0aec0;
      text-transform: uppercase;
    }
    
    .stat-value {
      font-size: 1.55rem;
      font-weight: bold;
      color: #98F190;
      margin-top: 5px;
    }
    
    .chart-container {
      height: 350px;
      margin-bottom: 20px;
    }
    
    .chart-section {
      background: #2D3748;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    
    .chart-title {
      color: #98F190;
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 15px;
      text-align: center;
    }
  </style>
</head>
<body class="bg-deepblack text-white font-sans">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-darkaccent p-6">
      <h1 class="text-2xl font-bold mb-6">SensorWatch</h1>

      <!-- Add a class for GSAP targeting -->
      <div class="space-y-4">
        <div class="bg-lightgrey text-white p-4 rounded-xl notification-item opacity-0 translate-y-4">
          <p class="font-bold text-lg">Freezer A</p>
          <p class="text-sm text-white">Temp dropped below range</p>
          <p class="text-xs text-white mt-1">🕒 12:23 • 30 min ago</p>
        </div>

        <div class="bg-lightgrey text-white p-4 rounded-xl notification-item opacity-0 translate-y-4">
          <p class="font-bold text-lg">Oven B</p>
          <p class="text-sm text-white">Temp dropped below range</p>
          <p class="text-xs text-white mt-1">🕒 12:23 • 30 min ago</p>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-8 overflow-y-auto">
      <!-- Top Bar -->
      <div class="flex justify-between items-center mb-6">
        <div class="flex gap-4">
          <div class="bg-limegreen text-greenbtntext px-6 py-4 rounded-xl text-center">
            <p class="text-4xl font-extrabold" id="active-sensors-count">--</p>
            <p class="font-semibold">Active Sensors</p>
          </div>
          <div class="bg-pinkaccent text-lightred px-6 py-4 rounded-xl text-center">
            <p class="text-4xl font-extrabold" id="sensor-warnings-count">0</p>
            <p class="font-semibold">Sensor Warnings</p>
          </div>
        </div>
        <div class="flex items-center gap-4">
          <button class="text-white">🔔</button>
          <button class="text-white">💬</button>
          <img src="https://via.placeholder.com/40" class="rounded-full w-10 h-10" alt="Profile" />
        </div>
      </div>

      <!-- Devices Section -->
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-bold">Devices</h2>
        <div class="flex gap-2">
          <input type="text" placeholder="Search sensors" class="bg-lightgrey text-white px-3 py-2 rounded placeholder-gray-400 focus:outline-none">
          <select class="bg-lightgrey text-white rounded px-3 py-2">
            <option>Location-Room</option>
          </select>
        </div>
      </div>

      <!-- Sensor Cards Grid -->
      <div id="sensor-grid" class="grid grid-cols-2 xl:grid-cols-3 gap-6">
        <!-- Loading state -->
        <div class="col-span-full text-center text-gray-400 py-8">
          <p>Loading sensors...</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Sensor Detail Modal -->
  <div id="sensorModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeSensorModal()">&times;</span>
      <h2 class="text-2xl font-bold text-limegreen mb-4" id="modalSensorTitle">Sensor Details</h2>
      
      <div class="flex gap-4 mb-6 flex-wrap items-center">
        <input type="number" id="limitInput" value="20" min="1" max="100" 
               placeholder="Number of readings"
               class="bg-lightgrey text-white px-4 py-2 rounded placeholder-gray-400 focus:outline-none">
        <div class="bg-limegreen text-greenbtntext px-4 py-2 rounded-lg font-semibold">
          🔄 Auto-refresh: 10s
        </div>
      </div>
      
      <div id="modalStatus" class="mb-4 text-center p-3 rounded"></div>
      
      <!-- Temperature Graph Section -->
      <div class="chart-section">
        <div class="chart-title">🌡️ Temperature Readings</div>
        <div class="chart-container">
          <canvas id="temperatureChart"></canvas>
        </div>
        <div class="flex justify-center flex-wrap gap-6 mt-4" id="tempStats"></div>
      </div>
      
      <!-- Humidity Graph Section -->
      <div class="chart-section">
        <div class="chart-title">💧 Humidity Readings</div>
        <div class="chart-container">
          <canvas id="humidityChart"></canvas>
        </div>
        <div class="flex justify-center flex-wrap gap-6 mt-4" id="humidityStats"></div>
      </div>
    </div>
  </div>

  <!-- JavaScript -->
  <script>
    // API endpoints - Using full domain URLs
    const SENSOR_LIST_URL = 'https://sensorwatch4.winwinlabs.org/sensors';
    const SENSOR_READINGS_URL = 'https://sensorwatch4.winwinlabs.org/sensors';

    // Global variables for graphs
    let currentSensorId = null;
    let temperatureChart = null;
    let humidityChart = null;
    let autoRefreshInterval = null;

    // Check if sensor reading has warnings (outside normal range)
    function checkSensorWarnings(reading) {
      if (!reading) return false;
      
      const warnings = [];
      
      // Temperature thresholds (adjust these based on your requirements)
      const TEMP_MIN = 32;  // 32°F (freezing)
      const TEMP_MAX = 100; // 100°F
      
      // Humidity thresholds
      const HUMIDITY_MIN = 20; // 20%
      const HUMIDITY_MAX = 80; // 80%
      
      if (reading.temp_value !== undefined) {
        if (reading.temp_value < TEMP_MIN || reading.temp_value > TEMP_MAX) {
          warnings.push('temperature');
        }
      }
      
      if (reading.humidity !== undefined) {
        if (reading.humidity < HUMIDITY_MIN || reading.humidity > HUMIDITY_MAX) {
          warnings.push('humidity');
        }
      }
      
      return warnings.length > 0;
    }

    // Fetch latest reading for a sensor
    async function fetchLatestReading(sensorId) {
      try {
        const response = await fetch(`${SENSOR_READINGS_URL}/${sensorId}/readings?limit=1`);
        
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const readings = await response.json();
        
        // Return the first (latest) reading
        if (readings && readings.length > 0) {
          return readings[0];
        }
        
        return null;
      } catch (error) {
        console.error(`Error fetching readings for ${sensorId}:`, error);
        return null;
      }
    }

    // Format the sensor reading value
    function formatSensorValue(reading) {
      if (!reading) {
        return '--';
      }
      
      // Check for temp_value field from your API
      if (reading.temp_value !== undefined) {
        const tempF = reading.temp_value.toFixed(1);
        const humidity = reading.humidity !== undefined ? reading.humidity.toFixed(1) : '--';
        return `${tempF}°F | ${humidity}%`;
      }
      
      return '--';
    }

    // Fetch and display sensors
    async function fetchAndDisplaySensors() {
      try {
        const response = await fetch(SENSOR_LIST_URL);
        
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const sensorIds = await response.json();
        
        // Update active sensor count
        document.getElementById('active-sensors-count').textContent = sensorIds.length;
        
        // Generate sensor cards
        const sensorGrid = document.getElementById('sensor-grid');
        sensorGrid.innerHTML = ''; // Clear loading message
        
        // Create cards and fetch readings for each sensor
        let warningCount = 0;
        const cardPromises = sensorIds.map(async (sensorId, index) => {
          const latestReading = await fetchLatestReading(sensorId);
          
          // Check if this sensor has warnings
          if (checkSensorWarnings(latestReading)) {
            warningCount++;
          }
          
          return createSensorCard(sensorId, latestReading);
        });
        
        // Wait for all cards to be created
        const cards = await Promise.all(cardPromises);
        
        // Update warning count
        document.getElementById('sensor-warnings-count').textContent = warningCount;
        
        // Append all cards to the grid
        cards.forEach(card => {
          sensorGrid.appendChild(card);
        });
        
        // Initialize GSAP animations after cards are created
        initializeAnimations();
        
      } catch (error) {
        console.error('Error fetching sensors:', error);
        document.getElementById('sensor-grid').innerHTML = `
          <div class="col-span-full text-center text-pinkaccent py-8">
            <p>Unable to load sensors. Please check the API endpoint.</p>
            <p class="text-sm text-gray-400 mt-2">${error.message}</p>
          </div>
        `;
        // Set count to 0 on error
        document.getElementById('active-sensors-count').textContent = '0';
        document.getElementById('sensor-warnings-count').textContent = '0';
      }
    }

    // Create a sensor card element
    function createSensorCard(sensorId, reading) {
      const link = document.createElement('div');
      link.onclick = () => openSensorModal(sensorId);
      link.className = 'block cursor-pointer group focus:outline-none focus:ring-2 focus:ring-limegreen rounded-xl';
      
      const sensorValue = formatSensorValue(reading);
      const hasWarning = checkSensorWarnings(reading);
      
      // Determine card styling based on warning status
      const cardBgClass = hasWarning ? 'bg-[#3D1F1F] border-2 border-pinkaccent' : 'bg-lightgrey';
      const warningIcon = hasWarning ? '<span class="text-pinkaccent text-2xl">⚠️</span>' : '';
      
      link.innerHTML = `
        <div class="${cardBgClass} p-6 rounded-xl sensor-card transition-colors group-hover:bg-[#4a4c5a]">
          <div class="flex justify-between items-center">
            <div>
              <p class="text-xl font-bold">${sensorId}</p>
            </div>
            <div>${warningIcon}</div>
          </div>
          <div class="flex justify-between items-end mt-6">
            <div></div>
            <div class="text-right">
              <p class="text-limegreen text-lg font-bold">${sensorValue}</p>
            </div>
          </div>
        </div>
      `;
      
      return link;
    }

    // Open sensor modal with graphs
    function openSensorModal(sensorId) {
      currentSensorId = sensorId;
      document.getElementById('modalSensorTitle').textContent = `${sensorId} - Temperature & Humidity`;
      document.getElementById('sensorModal').style.display = 'block';
      
      // Initial data load
      fetchAndPlotSensorData();
      
      // Start auto-refresh every 10 seconds
      if (autoRefreshInterval) {
        clearInterval(autoRefreshInterval);
      }
      autoRefreshInterval = setInterval(fetchAndPlotSensorData, 10000);
    }

    // Close sensor modal
    function closeSensorModal() {
      document.getElementById('sensorModal').style.display = 'none';
      if (autoRefreshInterval) {
        clearInterval(autoRefreshInterval);
        autoRefreshInterval = null;
      }
      if (temperatureChart) {
        temperatureChart.destroy();
        temperatureChart = null;
      }
      if (humidityChart) {
        humidityChart.destroy();
        humidityChart = null;
      }
    }

    // Show status in modal
    function showModalStatus(message, type) {
      const statusDiv = document.getElementById('modalStatus');
      statusDiv.textContent = message;
      statusDiv.className = `mb-4 text-center p-3 rounded ${
        type === 'loading' ? 'bg-yellowbtn text-black' :
        type === 'success' ? 'bg-limegreen text-greenbtntext' :
        type === 'error' ? 'bg-pinkaccent text-white' :
        'bg-lightgrey text-white'
      }`;
    }

    // Fetch sensor data for graphing
    async function fetchSensorData(sensorId, limit = 20) {
      const url = `${SENSOR_READINGS_URL}/${sensorId}/readings?limit=${limit}`;
      try {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        return await response.json();
      } catch (error) {
        console.error('Error fetching data:', error);
        throw error;
      }
    }

    // Parse data for graphing (separate temperature and humidity)
    function parseData(data) {
      const timestamps = [];
      const temperatureValues = [];
      const humidityValues = [];

      data.forEach((reading) => {
        if (reading.timestamp) {
          const date = new Date(reading.timestamp);
          timestamps.push(date.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit'}));
        }

        // Extract temperature
        let tempValue = null;
        if (reading.temp_value !== undefined) {
          tempValue = reading.temp_value;
        } else if (reading.temperature !== undefined) {
          tempValue = reading.temperature;
        } else if (reading.temp !== undefined) {
          tempValue = reading.temp;
        }
        
        if (tempValue !== null) {
          temperatureValues.push(parseFloat(tempValue));
        } else {
          temperatureValues.push(null);
        }

        // Extract humidity
        let humidityValue = null;
        if (reading.humidity !== undefined) {
          humidityValue = reading.humidity;
        }
        
        if (humidityValue !== null) {
          humidityValues.push(parseFloat(humidityValue));
        } else {
          humidityValues.push(null);
        }
      });

      return { timestamps, temperatureValues, humidityValues };
    }

    // Calculate statistics
    function calculateStats(values) {
      const validValues = values.filter(v => v !== null);
      if (!validValues.length) return null;
      const min = Math.min(...validValues);
      const max = Math.max(...validValues);
      const avg = validValues.reduce((a, b) => a + b, 0) / validValues.length;
      const latest = validValues[0];
      return { min, max, avg, latest, count: validValues.length };
    }

    // Display statistics
    function displayStats(stats, elementId, unit) {
      if (!stats) {
        document.getElementById(elementId).innerHTML = '<p class="text-gray-400">No data available</p>';
        return;
      }
      const statsDiv = document.getElementById(elementId);
      statsDiv.innerHTML = `
        <div class="stat-card">
          <div class="stat-label">Latest</div>
          <div class="stat-value">${stats.latest.toFixed(2)}${unit}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Average</div>
          <div class="stat-value">${stats.avg.toFixed(2)}${unit}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Min</div>
          <div class="stat-value">${stats.min.toFixed(2)}${unit}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Max</div>
          <div class="stat-value">${stats.max.toFixed(2)}${unit}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Points</div>
          <div class="stat-value">${stats.count}</div>
        </div>
      `;
    }

    // Plot temperature data
    function plotTemperatureData(timestamps, values, sensorId) {
      const ctx = document.getElementById('temperatureChart').getContext('2d');
      if (temperatureChart) temperatureChart.destroy();

      temperatureChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: timestamps,
          datasets: [{
            label: `${sensorId} Temperature`,
            data: values,
            borderColor: '#FB7A7C',
            backgroundColor: 'rgba(251, 122, 124, 0.08)',
            tension: 0.4,
            fill: true,
            pointRadius: 3,
            pointHoverRadius: 6,
            pointBackgroundColor: '#FB7A7C',
            pointBorderColor: '#610002'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: true,
              position: 'top',
              labels: { color: '#a0aec0' }
            },
            tooltip: {
              backgroundColor: '#1E1F25',
              titleColor: '#FB7A7C',
              bodyColor: '#a0aec0',
              borderColor: '#FB7A7C',
              borderWidth: 1
            }
          },
          scales: {
            y: {
              beginAtZero: false,
              title: { display: true, text: 'Temperature (°F)', color: '#a0aec0' },
              ticks: { color: '#a0aec0' },
              grid: { color: 'rgba(251, 122, 124, 0.08)' }
            },
            x: {
              title: { display: true, text: 'Time', color: '#a0aec0' },
              ticks: { color: '#a0aec0' },
              grid: { color: 'rgba(251, 122, 124, 0.08)' }
            }
          }
        }
      });
    }

    // Plot humidity data
    function plotHumidityData(timestamps, values, sensorId) {
      const ctx = document.getElementById('humidityChart').getContext('2d');
      if (humidityChart) humidityChart.destroy();

      humidityChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: timestamps,
          datasets: [{
            label: `${sensorId} Humidity`,
            data: values,
            borderColor: '#98F190',
            backgroundColor: 'rgba(152, 241, 144, 0.08)',
            tension: 0.4,
            fill: true,
            pointRadius: 3,
            pointHoverRadius: 6,
            pointBackgroundColor: '#98F190',
            pointBorderColor: '#00361C'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: true,
              position: 'top',
              labels: { color: '#a0aec0' }
            },
            tooltip: {
              backgroundColor: '#1E1F25',
              titleColor: '#98F190',
              bodyColor: '#a0aec0',
              borderColor: '#98F190',
              borderWidth: 1
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              max: 100,
              title: { display: true, text: 'Humidity (%)', color: '#a0aec0' },
              ticks: { color: '#a0aec0' },
              grid: { color: 'rgba(152, 241, 144, 0.08)' }
            },
            x: {
              title: { display: true, text: 'Time', color: '#a0aec0' },
              ticks: { color: '#a0aec0' },
              grid: { color: 'rgba(152, 241, 144, 0.08)' }
            }
          }
        }
      });
    }

    // Fetch and plot sensor data
    async function fetchAndPlotSensorData() {
      if (!currentSensorId) {
        showModalStatus('No sensor selected', 'error');
        return;
      }

      const limit = parseInt(document.getElementById('limitInput').value) || 20;
      showModalStatus(`Fetching data from ${currentSensorId}...`, 'loading');

      try {
        const data = await fetchSensorData(currentSensorId, limit);
        const { timestamps, temperatureValues, humidityValues } = parseData(data);

        // Plot temperature
        if (temperatureValues.some(v => v !== null)) {
          plotTemperatureData(timestamps, temperatureValues, currentSensorId);
          displayStats(calculateStats(temperatureValues), 'tempStats', '°F');
        } else {
          document.getElementById('tempStats').innerHTML = '<p class="text-gray-400">No temperature data available</p>';
        }

        // Plot humidity
        if (humidityValues.some(v => v !== null)) {
          plotHumidityData(timestamps, humidityValues, currentSensorId);
          displayStats(calculateStats(humidityValues), 'humidityStats', '%');
        } else {
          document.getElementById('humidityStats').innerHTML = '<p class="text-gray-400">No humidity data available</p>';
        }

        const totalPoints = timestamps.length;
        showModalStatus(`✓ Loaded ${totalPoints} readings from ${currentSensorId}`, 'success');
      } catch (error) {
        showModalStatus(`✗ Error fetching ${currentSensorId}: ${error.message}`, 'error');
        console.error('Full error:', error);
      }
    }

    // Initialize GSAP animations
    function initializeAnimations() {
      // Sidebar notifications: staggered slide/fade-in
      const items = document.querySelectorAll('.notification-item');
      if (items.length) {
        gsap.to(items, {
          opacity: 1,
          y: 0,
          duration: 0.6,
          ease: 'power3.out',
          stagger: 0.15
        });

        // Gentle attention pulse after entrance
        items.forEach((el, i) => {
          gsap.to(el, {
            scale: 1.02,
            duration: 0.8,
            yoyo: true,
            repeat: 2,
            delay: 0.6 + i * 0.1,
            ease: 'sine.inOut',
            transformOrigin: 'center'
          });
        });
      }

      // Optional: sensor card hover lift using GSAP (progressive enhancement)
      const cards = document.querySelectorAll('.sensor-card');
      cards.forEach(card => {
        card.addEventListener('mouseenter', () => {
          gsap.to(card, { y: -4, duration: 0.2, ease: 'power2.out' });
        });
        card.addEventListener('mouseleave', () => {
          gsap.to(card, { y: 0, duration: 0.2, ease: 'power2.out' });
        });
      });
    }

    // Close modal when clicking outside
    window.onclick = function(event) {
      const modal = document.getElementById('sensorModal');
      if (event.target == modal) {
        closeSensorModal();
      }
    }

    // Load sensors when page loads
    window.addEventListener('DOMContentLoaded', () => {
      fetchAndDisplaySensors();
      
      // Refresh sensor list and warnings every 30 seconds
      setInterval(() => {
        fetchAndDisplaySensors();
      }, 30000);
    });
  </script>
</body>
</html>
